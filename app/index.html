<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame Home</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/typefaces.css">
<link rel="stylesheet" href="assets/private-fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
      <main class="stage" id="stage" tabindex="0" aria-label="TV stage, 1920 by 1080. Click it, then use the arrow keys, Enter for OK and Escape for Back.">
        <div class="scene" id="scene">
        <div class="bg" id="bg" aria-hidden="true">
          <img class="photo" id="photo" alt="">
          <video class="photo photo-video" id="photoVideo" muted loop playsinline preload="auto" aria-hidden="true"></video>
          <div class="scrim"></div>
          <div class="shade"></div>
          <div class="ut-dim ut-tr"></div>
        </div>

        <div class="home" id="home">
          <div class="topbar-bg" id="topBar" aria-hidden="true"></div>
          <div class="caption" id="caption"></div>
          <div class="music" id="music"></div>
          <div class="key-legend" id="keyLegend" aria-label="Colour buttons"></div>
          <nav class="utils" id="utils" aria-label="Home controls"></nav>
          <div class="util-focus-label" id="utilFocusLabel" aria-hidden="true"></div>

          <div class="dock" id="dock">
            <div class="mat" aria-hidden="true"><img class="mat-img" id="matImg" alt=""><div class="mat-scrim" id="matScrim"></div><div class="mat-veil"></div></div>
            <div class="shelf" id="shelf"><div class="track" id="track"><div class="plate" id="plate"></div></div></div>
            <div class="dock-empty" id="dockEmpty"></div>
          </div>
          <div class="cue" id="cueL" aria-hidden="true"></div>
          <div class="cue" id="cueR" aria-hidden="true"></div>
          <div class="dock-action" id="dockAction" role="button"></div>

        </div>

        </div>
        <section class="appearance" id="appearance" hidden role="dialog" aria-labelledby="appearanceTitle">
          <div class="settings-back" id="appearanceBack"></div>
          <h2 class="settings-title" id="appearanceTitle"></h2>
          <div class="appearance-rows" id="appearanceRows"></div>
          <p class="appearance-desc" id="appearanceDesc"></p>
          <div class="settings-status" id="appearanceStatus" aria-live="polite"></div>
        </section>
        <div class="sheet" id="sheet" hidden>
          <img class="sheet-bg" id="sheetBg" alt="" aria-hidden="true">
          <div class="sheet-veil" aria-hidden="true"></div>
          <div class="view" id="sheetView" role="dialog" aria-modal="true"></div>
        </div>
        <div class="np-overlay" id="npOverlay" aria-hidden="true">
          <img class="np-bg" id="npBg" alt="" aria-hidden="true">
          <div class="np-shade" aria-hidden="true"></div>
          <div class="np-stage" id="npStage"></div>
        </div>
        <div class="wifi-qr-overlay" id="wifiQr" aria-hidden="true">
          <img class="wifi-qr-bg" id="wifiQrBg" alt="" aria-hidden="true">
          <div class="wifi-qr-shade" aria-hidden="true"></div>
          <div class="wifi-qr-card" id="wifiQrCard">
            <canvas class="wifi-qr-canvas" id="wifiQrCanvas" width="420" height="420" aria-hidden="true"></canvas>
            <p class="wifi-qr-title" id="wifiQrTitle">Scan to join Wi‑Fi</p>
            <p class="wifi-qr-ssid" id="wifiQrSsid"></p>
          </div>
        </div>
        <div class="focus-status" id="focusStatus" aria-live="polite"></div>
        <div class="alexa-toast" id="alexaToast" role="status" aria-live="polite"></div>
        <div class="build-version" id="buildVersion" hidden></div>
      </main>
<script src="fork.js"></script>
<script src="device.js"></script>
<script src="assets/icons/metrics.js"></script>
<script src="assets/wallpapers/catalog.js"></script>
<script src="assets/adaptive-ink.js"></script>
<script src="assets/font-catalog.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/custom-wallpaper.js"></script>
<script src="assets/pkce.js"></script>
<script src="assets/alexa.js"></script>
<script src="assets/spotify.js"></script>
<script src="assets/calendar.js"></script>
<script src="assets/namedays-hu.js"></script>
<script src="assets/qrcode.js"></script>
<script src="main.js"></script>
</body>
</html>
