<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alexa Check</title>
<style>
  html, body { margin: 0; background: #101418; color: #e8edf2; font: 26px/1.35 system-ui, sans-serif; }
  main { padding: 56px 96px; }
  h1 { font-size: 44px; margin: 0 0 8px; }
  p.lead { margin: 0 0 32px; color: #9fb0c0; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 120px 1fr; gap: 4px 24px; padding: 14px 0; border-top: 1px solid #26303a; }
  .tag { font-weight: 700; }
  .wait { color: #9fb0c0; } .yes { color: #6ee7a0; } .no { color: #ff8a80; }
  .name { font-weight: 600; }
  .detail { grid-column: 2; color: #9fb0c0; font-size: 21px; word-break: break-all; }
  #verdict { margin-top: 28px; font-size: 30px; font-weight: 700; }
  #agent { margin-top: 16px; color: #6b7a88; font-size: 18px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Alexa Check</h1>
  <p class="lead">Tests whether this TV can talk to Amazon directly. No sign-in, nothing is sent to your account. Press Back to close.</p>
  <ol id="list"></ol>
  <div id="verdict" class="wait">Running…</div>
  <div id="agent"></div>
</main>
<script src="check.js"></script>
</body>
</html>
